name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows / build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      # Every push (and every PR) now leaves a downloadable dev build instead
      # of throwing the freshly-built exe away. This re-uses the release build
      # above, so it costs seconds rather than a second full compilation.
      - name: Package dev build
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/pinsight-dev-windows-x64"
          mkdir -p "$stage"
          cp target/release/pinsight.exe "$stage/"
          cp README.md LICENSE config.example.json "$stage/"
          cp -r assets "$stage/"
          printf '%s\n' "${GITHUB_SHA}" > "$stage/COMMIT"
          (cd dist && powershell -NoProfile -Command "Compress-Archive -Path 'pinsight-dev-windows-x64' -DestinationPath 'PinSight-nightly-windows-x64.zip' -Force")

      - name: Upload dev build artefact
        uses: actions/upload-artifact@v4
        with:
          name: pinsight-dev-windows-x64-${{ github.sha }}
          path: dist/PinSight-nightly-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  # Rolling, always-latest development package. Kept as a separate job so a
  # publishing hiccup shows up on its own rather than turning the build/test
  # job red, and `needs:` guarantees we never ship a build that failed CI.
  nightly:
    name: Rolling nightly dev build
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pinsight-nightly-release
      cancel-in-progress: true
    steps:
      - name: Download dev build
        uses: actions/download-artifact@v4
        with:
          name: pinsight-dev-windows-x64-${{ github.sha }}
          path: dist

      - name: Publish or update the rolling nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="dist/PinSight-nightly-windows-x64.zip"
          test -f "$asset"
          notes="Rolling development build of \`main\` at \`${GITHUB_SHA}\`, built $(date -u +%Y-%m-%dT%H:%M:%SZ). NOT a stable release: stable packages are published only by the \`v*\` tag workflow. This prerelease is ignored by the in-app updater."
          if gh release view nightly >/dev/null 2>&1; then
            # Fixed asset name + --clobber keeps the release from accumulating
            # an endless list of per-commit files.
            gh release upload nightly "$asset" --clobber
            gh release edit nightly \
              --title "Nightly (rolling dev build)" \
              --notes "$notes"
          else
            gh release create nightly "$asset" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Nightly (rolling dev build)" \
              --notes "$notes"
          fi
