name: Release

# Every push to main builds all six platform packages. The version in
# Cargo.toml is the single source of truth:
#   - version UNCHANGED  -> replace the assets on that version's existing
#                           Release in place (no new Release entry, no new tag)
#   - version BUMPED     -> create one new Release for the new version
# There is deliberately no `push: tags` trigger and no rolling "nightly"
# Release: those produced a cluttered list of near-duplicate entries.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upx:
        description: "UPX-compress the release binary (smaller, may trip antivirus)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Never cancel a publish midway: a half-replaced asset set is worse than a
# queued run. Rapid pushes simply wait their turn.
concurrency:
  group: pinsight-release
  cancel-in-progress: false

jobs:
  # Resolve the version ONCE so every matrix job and the publish job agree.
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml and check the release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only [package].version; Cargo.toml also contains dependency
          # versions, so stop at the next table.
          version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read [package].version from Cargo.toml"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          # Guard against a half-bumped version: Cargo.toml drives everything,
          # but the README badges and the Inno Setup default still carry a
          # literal version for humans / local builds. Fail loudly instead of
          # silently shipping mismatched packages.
          readme=$(grep -o 'release-v[0-9][^)-]*' README.md | head -n1 | sed 's/^release-//')
          iss=$(sed -n 's/.*#define AppVersion "\([^"]*\)".*/\1/p' packaging/windows/pinsight.iss | head -n1)
          if [ "$readme" != "$tag" ]; then
            echo "::error::README.md badge says $readme but Cargo.toml says $tag"
            exit 1
          fi
          if [ "$iss" != "$version" ]; then
            echo "::error::pinsight.iss says $iss but Cargo.toml says $version"
            exit 1
          fi
          # Every published version must have a real CHANGELOG section. A
          # version bump with no release notes is rejected before we spend
          # time building six platforms.
          if ! grep -q "^## \\[$version\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add release notes before publishing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Version $version -> release $tag (exists=$exists)"

  build:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pinsight.exe
            platform: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pinsight
            platform: x86_64-apple-darwin
          # 24.04 ships a pipewire new enough for the `libspa` crates that
          # `xcap` pulls in (22.04's 0.3.48 lacks spa_meta_first and friends).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: pinsight
            platform: linux-x86_64
          # Linux ARM64 builds *natively* on GitHub's `ubuntu-24.04-arm`
          # runner (arm64 hardware), so the regular apt dev libraries install
          # as arm64 and no cross sysroot / pkg-config gymnastics are needed.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: pinsight
            platform: linux-arm64
          # ARM builds:
          # - Windows on ARM builds natively on the Windows runner.
          # - macOS on Apple Silicon (macos-latest is arm64) builds
          #   aarch64-apple-darwin natively — no cross toolchain needed.
          # - Linux ARM64 builds natively on GitHub's `ubuntu-24.04-arm`
          #   runner (see entry above).
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: pinsight.exe
            platform: windows-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pinsight
            platform: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # On the native arm64 runner the system gcc is just `cc`/`gcc` (no
      # aarch64-unknown-linux-gnu- prefix), so point the aarch64 target's
      # linker at it. Harmless for the other (x86_64 / macOS / Windows) targets.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux needs the system libraries that `eframe`/`xcap`/`arboard`/`leptess`
      # load. `libpipewire-0.3-dev` is required by `libspa-sys` (pulled in by
      # `xcap`); `libtesseract-dev` is what the Linux OCR backend links.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libxcursor-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libtesseract-dev \
            libgbm-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX compress
        if: ${{ inputs.upx }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) choco install upx -y --no-progress ;;
            Linux)   sudo apt-get update && sudo apt-get install -y upx-ucl ;;
            macOS)   brew install upx ;;
          esac
          upx --best --lzma "target/${{ matrix.target }}/release/${{ matrix.artifact }}"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          stage="dist/pinsight-${{ matrix.platform }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$stage/"
          cp README.md LICENSE config.example.json "$stage/"
          cp -r assets "$stage/"
          echo "$version" > "$stage/VERSION"
          printf '%s\n' "${GITHUB_SHA}" > "$stage/COMMIT"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && powershell -NoProfile -Command "Compress-Archive -Path 'pinsight-${{ matrix.platform }}' -DestinationPath 'PinSight-$version-${{ matrix.platform }}.zip' -Force")
          else
            (cd dist && tar -czf "PinSight-$version-${{ matrix.platform }}.tar.gz" "pinsight-${{ matrix.platform }}")
          fi

      # The portable zip is fine for a USB stick, but a real installer is what
      # lets the user choose the install directory (DisableDirPage=no in the
      # .iss). Only the x64 Windows job builds it (the script is x64-only).
      - name: Build Windows installer
        if: ${{ matrix.platform == 'windows-x64' }}
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          $version = "$env:VERSION"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }

          # The Simplified Chinese translation now ships *in the repo*
          # (packaging/windows/Languages/ChineseSimplified.isl), so the installer
          # is built bilingual and auto-selects the system language. Only fall
          # back to an English-only installer via /DNoChinese if the file is
          # somehow missing from the checkout.
          $langFile = "$PWD\packaging\windows\Languages\ChineseSimplified.isl"
          # NB: never assign to $args in PowerShell — it is an automatic
          # variable holding the script's unbound arguments.
          $isccArgs = @("/DAppVersion=$version", "/DPinsightExe=$PWD\target\${{ matrix.target }}\release\pinsight.exe")
          if (-not (Test-Path $langFile)) {
            Write-Host "ChineseSimplified.isl not found; building an English-only installer"
            $isccArgs += "/DNoChinese"
          }
          $isccArgs += "packaging\windows\pinsight.iss"
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # Windows produces a zip (+ installer), macOS/Linux a tar.gz — accept any
      # so `if-no-files-found: error` only trips when a build produced nothing.
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: pinsight-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error
          overwrite: true

  # Replace the current version's assets in place, or open a new Release only
  # when Cargo.toml declares a version we have never published before.
  publish:
    name: Publish current version
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace assets or create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_EXISTS: ${{ needs.meta.outputs.release_exists }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artefacts were produced; refusing to publish"
            exit 1
          fi

          # Build the release notes from this version's CHANGELOG section:
          # a compact "Added / Changed / Fixed" summary plus the full text.
          # Written to a file (never appended), so repeated publishes cannot
          # duplicate the changelog. Fails loudly if the section is missing.
          python3 tools/release_notes.py \
            --changelog CHANGELOG.md \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --repo "$GH_REPO" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Version $VERSION unchanged: replacing assets on $TAG"
            # Keep the tag pointing at the commit that produced these binaries,
            # so the Release page never shows a stale commit hash.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            for f in "${files[@]}"; do
              gh release upload "$TAG" "$f" --clobber
            done
            gh release edit "$TAG" \
              --title "PinSight v${VERSION}" \
              --notes-file release-notes.md
            # Moving the tag does not update the Release object's own
            # target_commitish; patch it so the page shows the commit that
            # actually produced these binaries rather than a stale hash.
            rid=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.id')
            gh api -X PATCH "repos/${GH_REPO}/releases/${rid}" \
              -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            echo "New version $VERSION: creating release $TAG"
            gh release create "$TAG" "${files[@]}" \
              --title "PinSight v${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
