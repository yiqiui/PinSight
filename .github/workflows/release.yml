name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upx:
        description: "UPX-compress the release binary (smaller, may trip antivirus)"
        type: boolean
        default: false
      version:
        description: "Release version WITHOUT the v prefix, e.g. 0.1.1 (also the tag published when dispatching manually)"
        type: string
        default: "0.1.1"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pinsight.exe
            platform: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pinsight
            platform: x86_64-apple-darwin
          # 24.04 ships a pipewire new enough for the `libspa` crates that
          # `xcap` pulls in (22.04's 0.3.48 lacks spa_meta_first and friends).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: pinsight
            platform: linux-x86_64
          # Linux ARM64 builds *natively* on GitHub's `ubuntu-24.04-arm`
          # runner (arm64 hardware), so the regular apt dev libraries install
          # as arm64 and no cross sysroot / pkg-config gymnastics are needed.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: pinsight
            platform: linux-arm64
          # ARM builds:
          # - Windows on ARM builds natively on the Windows runner.
          # - macOS on Apple Silicon (macos-latest is arm64) builds
          #   aarch64-apple-darwin natively — no cross toolchain needed.
          # - Linux ARM64 builds natively on GitHub's `ubuntu-24.04-arm`
          #   runner (see entry above).
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: pinsight.exe
            platform: windows-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pinsight
            platform: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # On the native arm64 runner the system gcc is just `cc`/`gcc` (no
      # aarch64-unknown-linux-gnu- prefix), so point the aarch64 target's
      # linker at it. Harmless for the other (x86_64 / macOS / Windows) targets.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux needs the system libraries that `eframe`/`xcap`/`arboard`/`leptess`
      # load. `libpipewire-0.3-dev` is required by `libspa-sys` (pulled in by
      # `xcap`); `libtesseract-dev` is what the Linux OCR backend links.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libxcursor-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libtesseract-dev \
            libgbm-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX compress
        if: ${{ inputs.upx }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) choco install upx -y --no-progress ;;
            Linux)   sudo apt-get update && sudo apt-get install -y upx-ucl ;;
            macOS)   brew install upx ;;
          esac
          upx --best --lzma "target/${{ matrix.target }}/release/${{ matrix.artifact }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          stage="dist/pinsight-${{ matrix.platform }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$stage/"
          cp README.md LICENSE config.example.json "$stage/"
          cp -r assets "$stage/"
          echo "$version" > "$stage/VERSION"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && powershell -NoProfile -Command "Compress-Archive -Path 'pinsight-${{ matrix.platform }}' -DestinationPath 'PinSight-$version-${{ matrix.platform }}.zip' -Force")
          else
            (cd dist && tar -czf "PinSight-$version-${{ matrix.platform }}.tar.gz" "pinsight-${{ matrix.platform }}")
          fi

      # The portable zip is fine for a USB stick, but a real installer is what
      # lets the user choose the install directory (DisableDirPage=no in the
      # .iss). Only the x64 Windows job builds it (the script is x64-only).
      - name: Build Windows installer
        if: ${{ matrix.platform == 'windows-x64' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }

          # ChineseSimplified.isl is an UNOFFICIAL translation and is absent
          # from the stock Inno Setup install used on GitHub runners. Without
          # this define the compile aborts with "Couldn't open include file",
          # which fails the whole Windows x64 job and (via needs: build) skips
          # publishing the release entirely.
          $langFile = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          # NB: never assign to $args in PowerShell — it is an automatic
          # variable holding the script's unbound arguments.
          $isccArgs = @("/DAppVersion=$version", "/DPinsightExe=$PWD\target\${{ matrix.target }}\release\pinsight.exe")
          if (-not (Test-Path $langFile)) {
            Write-Host "ChineseSimplified.isl not present; building an English-only installer"
            $isccArgs += "/DNoChinese"
          }
          $isccArgs += "packaging\windows\pinsight.iss"
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # Windows produces a zip (+ installer), macOS/Linux a tar.gz — accept any
      # so `if-no-files-found: error` only trips when a build produced nothing.
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: pinsight-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error
          overwrite: true

  # Publish every artefact (portable zips, tar.gz, and the Windows installer) on
  # the tag's GitHub Release, so the in-app updater can find and download them.
  # Publish on a `v*` tag AND on a manual dispatch. Previously the `if` only
  # allowed tag pushes, so clicking "Run workflow" built and uploaded every
  # artefact as a CI-only artefact and then silently skipped the publish step.
  # `github.ref_name` on a dispatch is the BRANCH name (`main`), so the tag
  # must be derived explicitly rather than reusing `github.ref_name`.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${{ github.ref_name }}"
          fi
          raw="${raw#v}"
          if [ -z "$raw" ]; then
            echo "::error::release version is empty; refusing to publish"
            exit 1
          fi
          echo "tag=v$raw" >> "$GITHUB_OUTPUT"
          echo "version=$raw" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PinSight v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          # Tags like v0.2.0-beta are published as prereleases.
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: dist/*
